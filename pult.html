<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт · Справа проти Липучки</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pult.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="conn" id="conn" title="Екран гри"><i></i><span id="conn-t">екран…</span></span>
    <span class="where" id="where">Заставка</span>
    <button type="button" class="icon-btn" id="menu-btn" aria-label="Меню" aria-expanded="false">⚙️</button>
  </header>

  <main id="step" aria-live="polite"></main>

  <details class="hint" id="hint">
    <summary>💡 Підказка</summary>
    <div id="hint-body"></div>
  </details>
</div>

<div class="menu" id="menu" hidden>
  <div class="menu-card" role="dialog" aria-modal="true" aria-label="Меню">
    <div class="menu-head"><b>Меню</b><button type="button" class="icon-btn" id="menu-close" aria-label="Закрити">✕</button></div>
    <button type="button" class="btn" id="m-sound">🔇 Звук вимкнено</button>
    <a class="btn" id="m-open" href="index.html" target="sprava-screen">🔗 Відкрити екран гри</a>
    <button type="button" class="btn" id="m-restart">↺ Почати заново</button>
    <div class="confirm" id="m-confirm" hidden>
      <p>Почати гру з заставки? Поточний прогрес зникне (його можна повернути кнопкою «↩ Назад»).</p>
      <div class="row">
        <button type="button" class="btn" id="m-no">Скасувати</button>
        <button type="button" class="btn danger" id="m-yes">Так, заново</button>
      </div>
    </div>
    <form class="room" id="room" hidden>
      <label for="room-input">Код кімнати з екрана гри</label>
      <div class="row">
        <input id="room-input" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" placeholder="0000">
        <button class="btn" type="submit">Підключити</button>
      </div>
    </form>
    <div class="keys">
      <b>Гарячі клавіші на екрані гри</b>
      F — повний екран · Пробіл — далі · 1–6 — обрати прийом · Esc — на початок
    </div>
  </div>
</div>

<script type="module" src="pult.js"></script>
</body>
</html>
